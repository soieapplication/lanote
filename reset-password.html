<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Note Gourmande — Réinitialiser le mot de passe</title>
<link rel="icon" href="assets/iconorange.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root{
    --cream:#FBF7F3; --ink:#2A2520; --ink-soft:#6F665E; --line:#EFE7DD;
    --orange:#DE6326; --orange-deep:#C24E17; --green:#206947; --green-deep:#183F2C;
    --green-night:#1A2721; --red:#C0392B;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:var(--green-night);color:var(--ink);font-family:'Montserrat',sans-serif;-webkit-font-smoothing:antialiased;
  }
  h1{font-family:'Playfair Display',serif;font-size:22px;margin:0 0 6px}
  .box{width:100%;max-width:380px;background:var(--cream);border-radius:16px;padding:38px 32px;box-shadow:0 30px 70px rgba(0,0,0,.35)}
  .box img{height:40px;margin-bottom:18px}
  p{color:var(--ink-soft);font-size:13px;margin:0 0 24px;line-height:1.6}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
  .field input{width:100%;border:1px solid var(--line);border-radius:8px;padding:12px 13px;font-family:'Montserrat',sans-serif;font-size:13.5px;background:#fff;color:var(--ink)}
  .btn{width:100%;background:var(--green);color:#fff;border:none;border-radius:9px;padding:14px;font-weight:800;font-size:13.5px;letter-spacing:.3px;cursor:pointer;margin-top:6px;transition:background .15s}
  .btn:hover{background:var(--green-deep)}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .msg{font-size:12.5px;margin-top:12px;line-height:1.6;display:none}
  .msg.show{display:block}
  .msg.error{color:var(--red)}
  .msg.success{color:var(--green-deep)}
  a.back{display:block;text-align:center;margin-top:18px;font-size:12px;color:var(--ink-soft);text-decoration:underline}
</style>
</head>
<body>

<div class="box">
  <img src="assets/logofull.png" alt="La Note Gourmande">
  <div id="content">
    <h1>Réinitialiser le mot de passe</h1>
    <p>Choisissez un nouveau mot de passe pour votre compte admin.</p>
    <div class="field">
      <label>Nouveau mot de passe</label>
      <input type="password" id="newPassword" placeholder="••••••••" autocomplete="new-password">
    </div>
    <div class="field">
      <label>Confirmer le mot de passe</label>
      <input type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password">
    </div>
    <button class="btn" id="submitBtn" onclick="submitNewPassword()">Enregistrer le mot de passe</button>
    <div class="msg" id="msg"></div>
  </div>
  <a class="back" href="admin.html">Retour à l'espace admin</a>
</div>

<script>
const SUPABASE_URL = 'https://ehkukujznqrlqrqawnff.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVoa3VrdWp6bnFybHFycWF3bmZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzOTE2MzQsImV4cCI6MjEwMzk2NzYzNH0.dW_aH97-iTsRZmNFV9X9obb6CP6Pbv3C9kWIT9O3MOo';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function showMsg(text, type){
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg show ' + type;
}

// Supabase's recovery link puts the session tokens in the URL hash and
// supabase-js picks them up automatically on load, firing this event once
// ready. Until then, block the form so a submit can't run without a session.
let sessionReady = false;
document.getElementById('submitBtn').disabled = true;

sb.auth.onAuthStateChange((event, session) => {
  if(event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)){
    sessionReady = true;
    document.getElementById('submitBtn').disabled = false;
  }
});

// Fallback: if no recovery event fires shortly (e.g. link already used, or
// opened without a valid token), tell the client instead of leaving a
// silently-broken form.
setTimeout(async () => {
  if(sessionReady) return;
  const { data } = await sb.auth.getSession();
  if(data.session){ sessionReady = true; document.getElementById('submitBtn').disabled = false; return; }
  document.getElementById('content').innerHTML = `
    <h1>Lien invalide ou expiré</h1>
    <p>Ce lien de réinitialisation n'est plus valide. Demandez-en un nouveau depuis l'écran de connexion admin.</p>
  `;
}, 2500);

async function submitNewPassword(){
  const pw = document.getElementById('newPassword').value;
  const confirm = document.getElementById('confirmPassword').value;
  if(pw.length < 8){ showMsg('Le mot de passe doit contenir au moins 8 caractères.', 'error'); return; }
  if(pw !== confirm){ showMsg('Les mots de passe ne correspondent pas.', 'error'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Enregistrement...';
  const { error } = await sb.auth.updateUser({ password: pw });
  btn.disabled = false; btn.textContent = 'Enregistrer le mot de passe';
  if(error){ showMsg('Erreur : ' + error.message, 'error'); return; }

  document.getElementById('content').innerHTML = `
    <h1>Mot de passe mis à jour</h1>
    <p>Vous pouvez maintenant vous connecter avec votre nouveau mot de passe.</p>
  `;
}
</script>
</body>
</html>
